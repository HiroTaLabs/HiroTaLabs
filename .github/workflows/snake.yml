name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HiroTaLabs
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish generated SVGs to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/snake-output
          mkdir -p /tmp/snake-output
          cp -R dist/. /tmp/snake-output/

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git switch --create output --track origin/output
          else
            git switch --orphan output
          fi

          git rm -rf . --ignore-unmatch

          cp -R /tmp/snake-output/. .
          touch .nojekyll

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update contribution snake"
            git push origin output
          fi
