name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HiroTaLabs
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Save generated files
        run: |
          set -e

          rm -rf /tmp/snake-output
          mkdir -p /tmp/snake-output

          cp dist/github-snake.svg /tmp/snake-output/
          cp dist/github-snake-dark.svg /tmp/snake-output/

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/output-branch

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git worktree add /tmp/output-branch origin/output
          else
            git worktree add --detach /tmp/output-branch
            cd /tmp/output-branch

            git checkout --orphan output
          fi

          cd /tmp/output-branch

          # Remove tracked files without deleting .git
          git rm -rf . --ignore-unmatch

          # Remove untracked files while keeping .git
          git clean -fdx

          cp /tmp/snake-output/github-snake.svg .
          cp /tmp/snake-output/github-snake-dark.svg .

          touch .nojekyll

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update contribution snake"
            git push origin HEAD:output
          fi

          cd "$GITHUB_WORKSPACE"
