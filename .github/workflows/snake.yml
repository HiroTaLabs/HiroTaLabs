name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HiroTaLabs
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Save generated files
        run: |
          set -e

          rm -rf /tmp/snake-output
          mkdir -p /tmp/snake-output

          cp dist/github-snake.svg /tmp/snake-output/
          cp dist/github-snake-dark.svg /tmp/snake-output/

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . --ignore-unmatch
          fi

          git rm -rf . --ignore-unmatch
          rm -rf .gitignore

          cp /tmp/snake-output/github-snake.svg .
          cp /tmp/snake-output/github-snake-dark.svg .

          touch .nojekyll

          git add github-snake.svg github-snake-dark.svg .nojekyll

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update contribution snake"
            git push origin output
          fi
